server:
  port: 8080

spring:
  application:
    name: gateway
  config:
    import: optional:file:.env[.properties]
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: expense-transactions
              uri:  ${EXPENSE_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/transactions/**
            - id: expense-categories
              uri:  ${EXPENSE_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/categories/**
            - id: expense-budgets
              uri:  ${EXPENSE_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/budgets/**
            - id: expense-summary
              uri:  ${EXPENSE_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/summary/**

management:
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    issuer: exptrack-identity