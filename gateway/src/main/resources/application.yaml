server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: gateway
  config:
    import: optional:file:.env[.properties]
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: expense-transactions
              uri:  ${EXPENSE_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/transactions/**
            - id: expense-categories
              uri:  ${EXPENSE_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/categories/**
            - id: expense-budgets
              uri:  ${EXPENSE_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/budgets/**
            - id: expense-summary
              uri:  ${EXPENSE_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/summary/**
            - id: notification-service
              uri:  ${NOTIFICATION_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/notifications/**
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.exptrack: INFO
    org.hibernate.SQL: WARN

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    issuer: exptrack-identity