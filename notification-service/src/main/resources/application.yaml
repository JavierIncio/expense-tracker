server:
  port: 8083

spring:
  application:
    name: notification-service
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exptrack_db}
    username: ${SPRING_DATASOURCE_USERNAME:exptrack}
    password: ${SPRING_DATASOURCE_PASSWORD:exptrack_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    table: notification_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_DEFAULT_USER:exptrack}
    password: ${RABBITMQ_DEFAULT_PASS:exptrack_password}

management:
  endpoint:
    health:
      show-details: always
