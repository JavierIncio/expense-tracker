name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 25
        cache: maven

    - name: Build with Maven wrapper
      run: |
        chmod +x mvnw
        ./mvnw -B clean verify
