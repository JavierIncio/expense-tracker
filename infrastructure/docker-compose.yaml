name: exptrack

services:
  postgres:
    image: postgres:16-alpine
    container_name: exptrack_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exptrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exptrack_password}
      POSTGRES_DB: ${POSTGRES_DB:-exptrack_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-exptrack} -d ${POSTGRES_DB:-exptrack_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: exptrack_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-exptrack}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-exptrack_password}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: exptrack_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:11.5.2
    container_name: exptrack_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    container_name: exptrack_gateway
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      IDENTITY_SERVICE_URI: http://identity-service:8081
      EXPENSE_SERVICE_URI: http://expense-service:8082
      NOTIFICATION_SERVICE_URI: http://notification-service:8083
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 35s

  identity-service:
    build:
      context: ..
      dockerfile: identity-service/Dockerfile
    container_name: exptrack_identity
    ports:
      - "8081:8081"
    env_file:
      - ../.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/exptrack_db
      SPRING_DATASOURCE_USERNAME: exptrack
      SPRING_DATASOURCE_PASSWORD: exptrack_password
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 35s

  expense-service:
    build:
      context: ..
      dockerfile: expense-service/Dockerfile
    container_name: exptrack_expense
    ports:
      - "8082:8082"
    env_file:
      - ../.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/exptrack_db
      SPRING_DATASOURCE_USERNAME: exptrack
      SPRING_DATASOURCE_PASSWORD: exptrack_password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 35s

  notification-service:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
    container_name: exptrack_notification
    ports:
      - "8083:8083"
    env_file:
      - ../.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/exptrack_db
      SPRING_DATASOURCE_USERNAME: exptrack
      SPRING_DATASOURCE_PASSWORD: exptrack_password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 35s

volumes:
  postgres-data:
  rabbitmq-data:
  grafana-data:
